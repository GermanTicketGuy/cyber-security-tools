name: Generate & validate

on:
  push:
    branches: [main, master]
    paths:
      - "data/**"
      - "categories.toml"
      - "generate.py"
  pull_request:
    paths:
      - "data/**"
      - "categories.toml"
      - "generate.py"
  workflow_dispatch:
  schedule:
    # Weekly link-rot / fork / archived check every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails only if the data is broken (invalid TOML, unknown category, …),
      # so a contributor only ever needs to edit files in data/.
      - name: Regenerate README
        run: python3 generate.py

      # On a merge/push to main (not on PRs): commit the refreshed README back,
      # so the generated README stays in sync without anyone running the script.
      - name: Commit updated README
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: regenerate README [skip ci]"
            git push
          else
            echo "README already up to date."
          fi

      - name: Check repos (forks / archived / dead links)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate.py --check
        continue-on-error: true
