[[tool]]
name = "OWASP ZAP"
repo = "zaproxy/zaproxy"
description = "Full-featured open-source web application security scanner and proxy."

[[tool]]
name = "Nuclei"
repo = "projectdiscovery/nuclei"
description = "Template-based vulnerability scanner powered by a huge community ruleset."

[[tool]]
name = "sqlmap"
repo = "sqlmapproject/sqlmap"
description = "Automates detection and exploitation of SQL injection flaws."

[[tool]]
name = "ffuf"
