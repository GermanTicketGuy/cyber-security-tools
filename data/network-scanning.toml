[[tool]]
name = "Nmap"
repo = "nmap/nmap"
description = "The classic network discovery and security auditing scanner."

[[tool]]
name = "Masscan"
repo = "robertdavidgraham/masscan"
description = "Internet-scale port scanner able to scan the whole IPv4 range quickly."

